name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Toolchain pins. Keep these consistent with clearinghouse/Cargo.lock:
#   anchor-lang 1.2.0 (Solana 3.x crates, MSRV 1.89), litesvm 0.18.0 (MSRV 1.97.1).
env:
  RUST_VERSION: "1.99.0"
  AGAVE_VERSION: "v4.3.0"
  ANCHOR_VERSION: "1.2.0"
  NODE_VERSION: "20"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, unit tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clearinghouse
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clearinghouse

      - name: cargo fmt --check
        run: cargo fmt --check

      # ch_core needs exactly one oracle backend (mock-oracle | pyth) and
      # exactly one venue authentication mode (dev-venue-signer | venue-cpi).
      - name: "Clippy (localnet config: mock-oracle + dev-venue-signer)"
        run: cargo clippy --workspace --all-targets --features ch_core/mock-oracle,ch_core/dev-venue-signer -- -D warnings

      - name: "Clippy (production config: pyth + venue-cpi)"
        run: cargo clippy -p ch_core --all-targets --features pyth,venue-cpi -- -D warnings

      - name: Clippy (mock-oracle + venue-cpi, used by the CPI suite)
        run: cargo clippy -p ch_core --all-targets --features mock-oracle,venue-cpi -- -D warnings

      - name: Clippy (pyth + dev-venue-signer, used by the Pyth suite)
        run: cargo clippy -p ch_core --all-targets --features pyth,dev-venue-signer -- -D warnings

      - name: ch_core unit tests with the Pyth backend (parser vs real mainnet bytes)
        run: cargo test -p ch_core --features pyth,venue-cpi

      - name: Feature selection must be explicit (build fails closed otherwise)
        run: |
          for f in "" "mock-oracle" "dev-venue-signer" "mock-oracle,pyth,venue-cpi" "mock-oracle,venue-cpi,dev-venue-signer"; do
            if cargo check -p ch_core --features "$f" 2>/dev/null; then
              echo "::error::ch_core compiled with features '$f'"; exit 1
            fi
          done

      - name: Unit, property and vector tests (no SBF build needed)
        run: cargo test --workspace --features ch_core/mock-oracle,ch_core/dev-venue-signer

      - name: cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: clearinghouse

  sbf:
    name: SBF build + LiteSVM instruction tests + IDL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clearinghouse
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # ch_svm_tests is a separate workspace (own Cargo.lock) so that
          # litesvm's pins never change the program's dependencies.
          workspaces: |
            clearinghouse
            clearinghouse/crates/ch_svm_tests

      - name: Install Agave ${{ env.AGAVE_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI ${{ env.ANCHOR_VERSION }} (prebuilt)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          rustc --version
          solana --version
          cargo build-sbf --version
          anchor --version

      - name: Program IDs agree (declare_id!, Anchor.toml, genesis, committed IDL)
        run: node scripts/ci/check-program-ids.cjs

      - name: Build programs (SBF)
        run: |
          # Localnet/test build used by LiteSVM, anchor test and the testbench.
          cargo build-sbf --manifest-path programs/ch_core/Cargo.toml --features mock-oracle,dev-venue-signer
          # Production venue authentication, exercised by the CPI suite.
          cargo build-sbf --manifest-path programs/ch_core/Cargo.toml --features mock-oracle,venue-cpi --sbf-out-dir target/deploy-cpi
          # Real oracle backend, exercised by the Pyth suite.
          cargo build-sbf --manifest-path programs/ch_core/Cargo.toml --features pyth,dev-venue-signer --sbf-out-dir target/deploy-pyth
          # Production configuration must build for SBF (not deployed here).
          cargo build-sbf --manifest-path programs/ch_core/Cargo.toml --features pyth,venue-cpi --sbf-out-dir target/deploy-prod
          cargo build-sbf --manifest-path programs/mock_perps_a/Cargo.toml
          cargo build-sbf --manifest-path programs/mock_perps_b/Cargo.toml

      - name: Generate IDL and fail if the committed copy differs
        run: |
          anchor idl build -p ch_core -o target/idl/ch_core.json -t target/types/ch_core.ts -- --features mock-oracle,dev-venue-signer
          node scripts/ci/check-idl.cjs

      - name: ch_svm_tests fmt + clippy
        run: |
          cargo fmt --check --manifest-path crates/ch_svm_tests/Cargo.toml
          cargo clippy --manifest-path crates/ch_svm_tests/Cargo.toml --all-targets -- -D warnings

      - name: LiteSVM instruction-level tests (run the compiled program)
        run: cargo test --manifest-path crates/ch_svm_tests/Cargo.toml -- --nocapture

      - name: Upload program + IDL for the integration job
        uses: actions/upload-artifact@v4
        with:
          name: ch_core-build
          path: |
            clearinghouse/target/deploy/ch_core.so
            clearinghouse/target/idl/ch_core.json
            clearinghouse/target/types/ch_core.ts
          if-no-files-found: error

  anchor-integration:
    name: Anchor TS integration tests (program loaded in a local validator)
    runs-on: ubuntu-latest
    needs: sbf
    defaults:
      run:
        working-directory: clearinghouse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: clearinghouse/yarn.lock

      - name: Install Agave ${{ env.AGAVE_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI ${{ env.ANCHOR_VERSION }} (prebuilt)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          name: ch_core-build
          path: clearinghouse/target

      - name: Test wallet
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --force -s -o ~/.config/solana/id.json

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type-check tests
        run: npx tsc --noEmit -p tsconfig.json

      # The program is loaded at its declare_id! address through
      # [[test.genesis]] in Anchor.toml, so the validator runs exactly the
      # artifact built and LiteSVM-tested above.
      - name: anchor test (legacy solana-test-validator, genesis-loaded program)
        run: anchor test --validator legacy --skip-build --skip-deploy

  testbench:
    name: Testbench (vitest, tsc, build, npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clearinghouse/testbench
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clearinghouse/testbench/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev

  # Single required check. Fails if any job above failed, was cancelled, or
  # was skipped - a skipped stage must never look like a pass.
  ci-required:
    name: All required checks
    runs-on: ubuntu-latest
    if: always()
    needs: [rust, sbf, anchor-integration, testbench]
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null \
            || { echo "::error::a required job did not succeed"; exit 1; }
