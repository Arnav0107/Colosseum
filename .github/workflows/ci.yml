name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Toolchain pins. Keep these consistent with the lockfiles:
#   clearinghouse/Cargo.lock:                  anchor-lang 1.2.0 (Solana 3.x crates, MSRV 1.89)
#   clearinghouse/crates/ch_svm_tests/Cargo.lock: litesvm 0.18.0 (MSRV 1.97.1), anchor-lang 1.2.1
#   ANCHOR_VERSION is the CLI used for `anchor idl build`; it matches the
#   program's anchor-lang (1.2.0).
# No job uses continue-on-error. `ci-required` fails if any job did not succeed.
env:
  RUST_VERSION: "1.99.0"
  AGAVE_VERSION: "v4.3.0"
  ANCHOR_VERSION: "1.2.0"
  CARGO_AUDIT_VERSION: "0.22.2"
  NODE_VERSION: "20.19.0"
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: clearinghouse

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path crates/ch_svm_tests/Cargo.toml

  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ch_core needs exactly one oracle backend and one venue-auth mode.
          - name: localnet mock-oracle + dev-venue-signer (workspace)
            args: --workspace --all-targets --features ch_core/mock-oracle,ch_core/dev-venue-signer
          - name: production pyth + venue-cpi
            args: -p ch_core --all-targets --features pyth,venue-cpi
          - name: CPI suite mock-oracle + venue-cpi
            args: -p ch_core --all-targets --features mock-oracle,venue-cpi
          - name: Pyth suite pyth + dev-venue-signer
            args: -p ch_core --all-targets --features pyth,dev-venue-signer
          - name: ch_svm_tests (separate workspace)
            args: --manifest-path crates/ch_svm_tests/Cargo.toml --all-targets
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            clearinghouse
            clearinghouse/crates/ch_svm_tests
      - run: cargo clippy ${{ matrix.args }} -- -D warnings

  cargo-test:
    name: cargo test (unit, property, vectors, Pyth parser) + feature gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clearinghouse
      - run: cargo test --workspace --features ch_core/mock-oracle,ch_core/dev-venue-signer
      - run: cargo test -p ch_core --features pyth,venue-cpi
      - name: Feature selection must be explicit (build fails closed otherwise)
        run: |
          for f in "" "mock-oracle" "dev-venue-signer" "mock-oracle,pyth,venue-cpi" "mock-oracle,venue-cpi,dev-venue-signer"; do
            if cargo check -p ch_core --features "$f" 2>/dev/null; then
              echo "::error::ch_core compiled with features '$f'"; exit 1
            fi
          done

  sbf:
    name: SBF build (ch_core x4 configs, mock_perps_a, mock_perps_b)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clearinghouse
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: |
          rustc --version
          solana --version
          cargo build-sbf --version
      - name: Program IDs agree (declare_id!, Anchor.toml, genesis, committed IDL)
        run: node scripts/ci/check-program-ids.cjs
      - name: Build
        run: |
          cargo build-sbf --manifest-path programs/ch_core/Cargo.toml --features mock-oracle,dev-venue-signer
          cargo build-sbf --manifest-path programs/ch_core/Cargo.toml --features mock-oracle,venue-cpi --sbf-out-dir target/deploy-cpi
          cargo build-sbf --manifest-path programs/ch_core/Cargo.toml --features pyth,dev-venue-signer --sbf-out-dir target/deploy-pyth
          cargo build-sbf --manifest-path programs/ch_core/Cargo.toml --features pyth,venue-cpi --sbf-out-dir target/deploy-prod
          cargo build-sbf --manifest-path programs/mock_perps_a/Cargo.toml
          cargo build-sbf --manifest-path programs/mock_perps_b/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sbf
          path: |
            clearinghouse/target/deploy/*.so
            clearinghouse/target/deploy-cpi/*.so
            clearinghouse/target/deploy-pyth/*.so
            clearinghouse/target/deploy-prod/*.so
          if-no-files-found: error

  litesvm:
    name: LiteSVM instruction tests (compiled programs)
    runs-on: ubuntu-latest
    needs: sbf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clearinghouse/crates/ch_svm_tests
      - uses: actions/download-artifact@v4
        with:
          name: sbf
          path: clearinghouse/target
      - run: cargo test --manifest-path crates/ch_svm_tests/Cargo.toml -- --nocapture

  idl:
    name: IDL check (regenerate, fail on diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clearinghouse
      - name: Install Anchor CLI ${{ env.ANCHOR_VERSION }} (prebuilt)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: anchor --version
      - run: anchor idl build -p ch_core -o target/idl/ch_core.json -t target/types/ch_core.ts -- --features mock-oracle,dev-venue-signer
      - run: node scripts/ci/check-idl.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: idl
          path: |
            clearinghouse/target/idl/ch_core.json
            clearinghouse/target/types/ch_core.ts
          if-no-files-found: error

  keeper:
    name: keeper tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clearinghouse/services/keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clearinghouse/services/keeper/package-lock.json
      - run: npm ci
      - run: npm test

  risk:
    name: risk-service tests + reproducible calibration/backtest outputs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clearinghouse/services/risk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clearinghouse/services/risk/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Committed calibration and backtest outputs are reproducible
        run: |
          npm run calibrate
          npm run backtest
          npm run frontier
          npm run leverage
          npm run throttle
          git diff --exit-code -- params/calibration.json ../../docs/backtest/results.json ../../docs/backtest/frontier.json ../../docs/backtest/leverage.json ../../docs/backtest/throttle.json

  testbench:
    name: testbench vitest + tsc + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clearinghouse/testbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clearinghouse/testbench/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

  audit:
    name: cargo audit + npm audit --omit=dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install cargo-audit ${{ env.CARGO_AUDIT_VERSION }}
        run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked
      - name: cargo audit (program workspace)
        run: cargo audit --file Cargo.lock
      - name: cargo audit (LiteSVM test workspace)
        run: cargo audit --file crates/ch_svm_tests/Cargo.lock
      # Each runs `npm audit --omit=dev` and fails on any advisory not in the
      # reviewed register (scripts/ci/npm-audit-accepted.json) or past its review date.
      - name: npm audit --omit=dev (testbench)
        run: node scripts/ci/check-npm-audit.cjs testbench
      - name: npm audit --omit=dev (keeper)
        run: node scripts/ci/check-npm-audit.cjs services/keeper
      - name: npm audit --omit=dev (risk service)
        run: node scripts/ci/check-npm-audit.cjs services/risk

  anchor-integration:
    name: Anchor TS integration tests (validator)
    runs-on: ubuntu-latest
    needs: [sbf, idl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: clearinghouse/yarn.lock
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor CLI ${{ env.ANCHOR_VERSION }} (prebuilt)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/anchor" \
            "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: sbf
          path: clearinghouse/target
      # tests/ch_core.ts imports ../target/types/ch_core (generated, checked in the idl job).
      - uses: actions/download-artifact@v4
        with:
          name: idl
          path: clearinghouse/target
      - name: Test wallet
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --force -s -o ~/.config/solana/id.json
      - run: yarn install --frozen-lockfile
      - run: npx tsc --noEmit -p tsconfig.json
      # The program is loaded at its declare_id! address through
      # [[test.genesis]] in Anchor.toml (the artifact LiteSVM tested).
      - run: anchor test --validator legacy --skip-build --skip-deploy

  demo:
    name: npm run demo (build, validator, smoke, before/after table)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clearinghouse
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: clearinghouse/testbench/package-lock.json
      - name: Install Agave ${{ env.AGAVE_VERSION }}
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: npm --prefix testbench ci
      - name: npm run demo
        run: |
          set -o pipefail
          npm run demo 2>&1 | tee demo-output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: clearinghouse/demo-output.txt

  # Single required check. Fails if any job above failed, was cancelled or
  # was skipped: a skipped stage must never look like a pass.
  ci-required:
    name: All required checks
    runs-on: ubuntu-latest
    if: always()
    needs: [fmt, clippy, cargo-test, sbf, litesvm, idl, keeper, risk, testbench, audit, anchor-integration, demo]
    defaults:
      run:
        working-directory: .
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null \
            || { echo "::error::a required job did not succeed"; exit 1; }
