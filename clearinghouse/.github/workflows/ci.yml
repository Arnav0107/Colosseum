name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-checks:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

  testbench:
    name: Testbench (npm ci, test, tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testbench
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: testbench/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build testbench
        run: npm run build

  anchor-tests:
    name: Anchor Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Solana & Anchor toolchain
        uses: actions/cache@v4
        id: cache-solana-anchor
        with:
          path: |
            ~/.local/share/solana
            ~/.cargo/bin/anchor
            ~/.cargo/bin/avm
          key: ${{ runner.os }}-solana-1.18.26-anchor-0.30.1

      - name: Install Solana CLI
        if: steps.cache-solana-anchor.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Add Solana to PATH (cached)
        if: steps.cache-solana-anchor.outputs.cache-hit == 'true'
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        if: steps.cache-solana-anchor.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v0.30.1 anchor-cli --locked

      - name: Setup Solana Keypair
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --force -s -o ~/.config/solana/id.json

      - name: Install root dependencies
        run: yarn install

      - name: Build ch_core
        run: anchor build -p ch_core

      - name: Run Anchor integration tests
        run: |
          solana-test-validator --reset --quiet &
          VALIDATOR_PID=$!
          sleep 5
          ANCHOR_PROVIDER_URL="http://127.0.0.1:8899" ANCHOR_WALLET="$HOME/.config/solana/id.json" yarn run ts-mocha -p ./tsconfig.json -t 1000000 'tests/ch_core.ts'
          kill $VALIDATOR_PID || true
