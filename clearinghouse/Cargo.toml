[workspace]
members = [
    "programs/ch_core",
    "programs/ch_fund",
    "programs/mock_perps_a",
    "programs/mock_perps_b",
    "crates/ch_client",
    "crates/ch_math",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
