[package]
name = "ch_core"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "ch_core"

[features]
# No default oracle backend. Exactly one of `mock-oracle` / `pyth` must be
# selected explicitly; anything else is a compile error (see src/oracle.rs).
# Localnet, tests and CI pass `--features mock-oracle`.
default = []
mock-oracle = []
pyth = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
ch_math = { path = "../../crates/ch_math" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
